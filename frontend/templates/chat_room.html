{% extends "base.html" %}
{% block page_title %}{{ stokvel_name }} Chat{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-6">
  <div class="card" style="padding: 0; border-radius: 12px; overflow: hidden;">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid #22304a;">
      <div style="font-weight:700; font-size:1.1rem;">{{ stokvel_name }} Chat</div>
      <a href="/messages" style="font-size:0.9rem; color:#60efff; text-decoration:none;">Back to Messages</a>
    </div>
    <div id="chat-messages" style="height:60vh; overflow-y:auto; padding: 12px; background:#0f1a2a;"></div>
    <form id="chat-form" style="display:flex; gap:8px; padding:12px; border-top:1px solid #22304a;">
      <input id="chat-input" type="text" placeholder="Type your message..." style="flex:1; border:1px solid #22304a; background:#1e3357; color:#eaf6fb; border-radius:8px; padding:10px;" autocomplete="off" required/>
      <button type="submit" class="btn" style="padding:10px 16px; border-radius:8px;">Send</button>
    </form>
  </div>
</div>
<div id="stokvel-data" data-stokvel-id="{{ stokvel_id }}" style="display:none;"></div>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const stokvelId = document.getElementById('stokvel-data').getAttribute('data-stokvel-id');
  const socket = io();
  const chatMessages = document.getElementById('chat-messages');
  const inputEl = document.getElementById('chat-input');

  function appendMessage(msg){
    const row = document.createElement('div');
    row.style.display='flex';row.style.alignItems='flex-start';row.style.marginBottom='8px';
    const avatar = document.createElement('div');
    avatar.style.cssText='width:32px;height:32px;border-radius:50%;background:#c7d2fe;display:flex;align-items:center;justify-content:center;font-weight:700;margin-right:8px;color:#0f1a2a;';
    avatar.textContent=(msg.username||'U').trim().charAt(0).toUpperCase();
    const bubble=document.createElement('div');
    bubble.style.cssText='background:#1e3357;border:1px solid #22304a;border-radius:12px;padding:8px 10px;max-width:75%;color:#eaf6fb;';
    bubble.innerHTML='<div style="font-weight:600">'+(msg.username||'User')+'</div>'+
                     '<div>'+msg.message+'</div>'+
                     '<div style="font-size:0.8em;color:#9fb3c8;">'+(msg.timestamp?new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'')+'</div>';
    row.appendChild(avatar);row.appendChild(bubble);chatMessages.appendChild(row);
  }

  function markRead(){
    fetch('/api/chats/mark-read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stokvel_id:stokvelId})});
  }

  socket.emit('join_stokvel_room',{stokvel_id:stokvelId});
  socket.emit('fetch_messages',{stokvel_id:stokvelId});
  socket.on('chat_history', (data)=>{chatMessages.innerHTML='';(data.messages||[]).forEach(appendMessage);chatMessages.scrollTop=chatMessages.scrollHeight;markRead();});
  socket.on('receive_message',(msg)=>{appendMessage(msg);chatMessages.scrollTop=chatMessages.scrollHeight;});
  document.getElementById('chat-form').addEventListener('submit', (e)=>{
    e.preventDefault();
    const m = inputEl.value;
    if (m && m.trim().length > 0) {
      socket.emit('send_message', {stokvel_id: stokvelId, message: m});
      inputEl.value = '';
    }
  });
  // typing indicator
  let t; inputEl.addEventListener('input',()=>{socket.emit('typing',{stokvel_id:stokvelId});clearTimeout(t);t=setTimeout(()=>socket.emit('stop_typing',{stokvel_id:stokvelId}),1000);});
  const tipId='typing';
  socket.on('show_typing',()=>{if(!document.getElementById(tipId)){const d=document.createElement('div');d.id=tipId;d.style.cssText='font-size:0.9em;color:#9fb3c8;margin:4px 0;';d.textContent='Someone is typing…';chatMessages.appendChild(d);chatMessages.scrollTop=chatMessages.scrollHeight;}});
  socket.on('hide_typing',()=>{const el=document.getElementById(tipId);if(el)el.remove();});
</script>
{% endblock %}
